[package]
name = "gallery-xml-demo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Demo / example binary — never published to crates.io.
publish = false

[dependencies]
gpui.workspace = true
gpui-ce-platform.workspace = true
yororen-ui = { package = "yororen_ui", path = "../../yororen-ui", features = ["xml"] }
yororen-ui-xml = { package = "yororen_ui_xml", path = "../../yororen-ui-xml" }
yororen-ui-default-renderer = { package = "yororen_ui_default_renderer", path = "../../yororen-ui-default-renderer" }
yororen-ui-winui-renderer = { package = "yororen_ui_winui_renderer", path = "../../yororen-ui-winui-renderer" }

[lints]
workspace = true
